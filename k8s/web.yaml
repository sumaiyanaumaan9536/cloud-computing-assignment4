apiVersion: v1
kind: ConfigMap
metadata:
  name: emi-config
  namespace: emi
data:
  MONGO_URL: "mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/emidb?replicaSet=rs0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emi-web
  namespace: emi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: emi-web
  template:
    metadata:
      labels:
        app: emi-web
    spec:
      containers:
        - name: emi-web
          image: emi-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              valueFrom:
                configMapKeyRef:
                  name: emi-config
                  key: MONGO_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: emi-web
  namespace: emi
spec:
  type: ClusterIP
  selector:
    app: emi-web
  ports:
    - port: 80
      targetPort: 3000
