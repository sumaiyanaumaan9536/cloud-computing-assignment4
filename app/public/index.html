<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 820px;">
  <h1 class="h3 mb-4">Loan EMI Calculator</h1>

  <div class="card mb-4">
    <div class="card-body">
      <form id="emiForm" novalidate>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="P">Loan amount</label>
            <input type="number" class="form-control" id="P" min="1" step="any" placeholder="500000">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="rate">Annual interest rate (%)</label>
            <input type="number" class="form-control" id="rate" min="0.01" step="any" placeholder="12">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="n">Tenure (months)</label>
            <input type="number" class="form-control" id="n" min="1" step="1" placeholder="24">
          </div>
        </div>
        <div id="formError" class="text-danger mt-3" style="display:none;"></div>
        <button type="submit" class="btn btn-primary mt-3">Calculate</button>
      </form>
    </div>
  </div>

  <div id="resultPanel" class="card mb-4" style="display:none;">
    <div class="card-header">Result</div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">Monthly EMI: <strong id="rEmi"></strong></li>
      <li class="list-group-item">Total payment: <strong id="rTotal"></strong></li>
      <li class="list-group-item">Total interest: <strong id="rInterest"></strong></li>
      <li class="list-group-item text-muted">Served by pod: <span id="rPod"></span> (<span id="rIp"></span>)</li>
    </ul>
  </div>

  <div class="card">
    <div class="card-header">Last 10 calculations</div>
    <div class="table-responsive">
      <table class="table table-sm table-striped mb-0">
        <thead>
          <tr><th>Time</th><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Pod</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function () {
  function money(x) { return Number(x).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

  function loadHistory() {
    $.getJSON('/api/history').done(function (rows) {
      var $body = $('#historyBody').empty();
      rows.forEach(function (r) {
        var $tr = $('<tr>');
        [new Date(r.createdAt).toLocaleString(), money(r.principal), r.rate, r.months, money(r.emi), r.servedBy]
          .forEach(function (v) { $tr.append($('<td>').text(v)); });
        $body.append($tr);
      });
    });
  }

  $('#emiForm').on('submit', function (e) {
    e.preventDefault();
    var P = parseFloat($('#P').val()), rate = parseFloat($('#rate').val()), n = parseInt($('#n').val(), 10);
    var $err = $('#formError').hide();
    if (!(P > 0) || !(rate > 0) || !(n > 0)) {
      $err.text('Please enter positive numbers in all three fields.').show();
      return;
    }
    $.ajax({
      url: '/api/emi', method: 'POST', contentType: 'application/json',
      data: JSON.stringify({ P: P, rate: rate, n: n })
    }).done(function (d) {
      $('#rEmi').text(money(d.emi));
      $('#rTotal').text(money(d.totalPayment));
      $('#rInterest').text(money(d.totalInterest));
      $('#rPod').text(d.servedBy);
      $('#rIp').text(d.podIp);
      $('#resultPanel').show();
      loadHistory();
    }).fail(function (xhr) {
      var msg = (xhr.responseJSON && xhr.responseJSON.error) || 'Request failed';
      $err.text(msg).show();
    });
  });

  loadHistory();
});
</script>
</body>
</html>
